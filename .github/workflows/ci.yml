name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage

  android:
    name: Android release build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true
      - run: flutter pub get
      # Generates the Gradle wrapper, which is not committed.
      - run: flutter build apk --config-only
      - name: Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      # Without key.properties the bundle is unsigned. This still proves R8
      # and resource shrinking produce a bundle; the Play upload key never
      # leaves the release machine.
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
