name: agecalculator
description: A production-ready Material 3 Age Calculator for Android with light/dark themes and accurate age calculations.
publish_to: 'none'

version: 1.3.0+7

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  share_plus: ^13.2.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
